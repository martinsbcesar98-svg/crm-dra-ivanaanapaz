<body>
<style>
  :root{
    --ground:#F4EEDF; --ground-2:#EFE7D3; --panel:#FBF7EC; --panel-2:#FFFDF7;
    --ink:#2B2720; --ink-soft:#6A6353; --hair:#E3D9C2;
    --gold:#B4872C; --gold-deep:#8F6A1E; --gold-tint:#F0E4C6;
    --green:#2E3D30; --green-soft:#46583F; --taupe:#856A4E; --taupe-tint:#EBE1D2;
    --ok:#4B6B44; --ok-bg:#E7EEDF; --warn:#B4872C; --warn-bg:#F5EBCF;
    --crit:#A2503A; --crit-bg:#F3E1DA; --info-bg:#E6E9E2;
    --radius:13px; --shadow:0 1px 2px rgba(43,39,32,.05),0 10px 30px -14px rgba(43,39,32,.22);
  }
  @media (prefers-color-scheme:dark){:root{
    --ground:#161812; --ground-2:#1D2019; --panel:#22261E; --panel-2:#272C22;
    --ink:#ECE6D6; --ink-soft:#A19A8A; --hair:#34382C;
    --gold:#D9B15A; --gold-deep:#C29A3E; --gold-tint:#2C2A1C;
    --green:#7FA37E; --green-soft:#9CBB99; --taupe:#C4A585; --taupe-tint:#2A261E;
    --ok:#86B07C; --ok-bg:#233022; --warn:#D9B15A; --warn-bg:#332C18;
    --crit:#D9846C; --crit-bg:#37241E; --info-bg:#242820;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 34px -16px rgba(0,0,0,.7);
  }}
  :root[data-theme="light"]{--ground:#F4EEDF;--ground-2:#EFE7D3;--panel:#FBF7EC;--panel-2:#FFFDF7;--ink:#2B2720;--ink-soft:#6A6353;--hair:#E3D9C2;--gold:#B4872C;--gold-deep:#8F6A1E;--gold-tint:#F0E4C6;--green:#2E3D30;--green-soft:#46583F;--taupe:#856A4E;--taupe-tint:#EBE1D2;--ok:#4B6B44;--ok-bg:#E7EEDF;--warn:#B4872C;--warn-bg:#F5EBCF;--crit:#A2503A;--crit-bg:#F3E1DA;--info-bg:#E6E9E2;--shadow:0 1px 2px rgba(43,39,32,.05),0 10px 30px -14px rgba(43,39,32,.22);}
  :root[data-theme="dark"]{--ground:#161812;--ground-2:#1D2019;--panel:#22261E;--panel-2:#272C22;--ink:#ECE6D6;--ink-soft:#A19A8A;--hair:#34382C;--gold:#D9B15A;--gold-deep:#C29A3E;--gold-tint:#2C2A1C;--green:#7FA37E;--green-soft:#9CBB99;--taupe:#C4A585;--taupe-tint:#2A261E;--ok:#86B07C;--ok-bg:#233022;--warn:#D9B15A;--warn-bg:#332C18;--crit:#D9846C;--crit-bg:#37241E;--info-bg:#242820;--shadow:0 1px 2px rgba(0,0,0,.35),0 12px 34px -16px rgba(0,0,0,.7);}

  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased}
  .serif{font-family:Georgia,"Times New Roman",serif}
  h1,h2,h3,h4{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0;line-height:1.2;text-wrap:balance}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:.92rem}

  /* ---------- App shell ---------- */
  .app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  .side{background:var(--green);color:#F4EEDF;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
  .brand svg{width:34px;height:40px;flex:none}
  .brand .bt{font-family:Georgia,serif;font-size:1.02rem;font-weight:600;line-height:1.1}
  .brand .bs{font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;opacity:.7}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:transparent;border:0;color:#Ebe4d3;padding:10px 12px;border-radius:9px;
    font-size:.92rem;font-weight:500;transition:background .15s}
  .nav button .ico{width:18px;text-align:center;opacity:.85}
  .nav button:hover{background:rgba(255,255,255,.08)}
  .nav button.active{background:rgba(244,238,223,.16);color:#fff;font-weight:600}
  .nav .badge{margin-left:auto;background:var(--gold);color:#2B2720;font-size:.68rem;font-weight:700;
    padding:1px 7px;border-radius:999px;min-width:19px;text-align:center}
  .side .foot{margin-top:auto;font-size:.7rem;opacity:.55;padding:8px}

  .main{padding:clamp(18px,3vw,34px);max-width:1120px;width:100%}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
  .head h1{font-size:clamp(1.5rem,3vw,2rem)}
  .head p{color:var(--ink-soft);font-size:.92rem;margin-top:3px}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--hair);background:var(--panel-2);
    color:var(--ink);padding:9px 15px;border-radius:9px;font-size:.88rem;font-weight:600;transition:.15s}
  .btn:hover{border-color:var(--gold)}
  .btn.primary{background:var(--green);color:#F4EEDF;border-color:var(--green)}
  .btn.primary:hover{background:var(--green-soft)}
  .btn.gold{background:var(--gold);color:#2B2720;border-color:var(--gold)}
  .btn.gold:hover{filter:brightness(1.06)}
  .btn.sm{padding:6px 11px;font-size:.8rem}
  .btn.ghost{background:transparent}
  .btn.wa{background:#1f6b43;color:#F4EEDF;border-color:#1f6b43}
  .btn.wa:hover{filter:brightness(1.1);border-color:#1f6b43}
  .btn.dgr{color:var(--crit);border-color:var(--crit)}
  .btn.dgr:hover{background:var(--crit);color:#F4EEDF}
  .search{width:100%;padding:12px 16px;margin-bottom:16px;border:1px solid var(--hair);border-radius:11px;
    background:var(--panel-2);color:var(--ink);font-size:.94rem}
  .search:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-tint)}
  .danger{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    margin-top:22px;padding:15px 18px;border:1px solid var(--crit);border-radius:var(--radius);
    background:var(--crit-bg)}
  .danger .dt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .danger .dt b{color:var(--crit);font-size:.92rem}
  .danger .dt span{font-size:.8rem;color:var(--ink-soft)}

  /* ---------- Cards / stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin-bottom:26px}
  .stat{background:var(--panel);border:1px solid var(--hair);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .stat .k{font-size:.74rem;letter-spacing:.05em;color:var(--ink-soft);text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:7px}
  .stat .v{font-family:Georgia,serif;font-size:2rem;margin-top:6px;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:.9rem;color:var(--ink-soft)}
  .stat .sub{font-size:.78rem;color:var(--ink-soft);margin-top:2px}

  .panel{background:var(--panel);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .panel > .ph{padding:15px 20px;border-bottom:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .panel > .ph h3{font-size:1.05rem}
  .panel .pb{padding:8px 8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}

  /* ---------- List rows ---------- */
  .row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:10px;transition:background .12s}
  .row:hover{background:var(--ground-2)}
  .row + .row{border-top:1px solid var(--hair)}
  .avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:var(--gold-tint);color:var(--gold-deep);font-weight:700;font-family:Georgia,serif;font-size:.95rem}
  .row .who{min-width:0;flex:1}
  .row .who .n{font-weight:600;font-size:.94rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .who .m{font-size:.8rem;color:var(--ink-soft)}
  .row .meta{text-align:right;font-size:.8rem;color:var(--ink-soft);white-space:nowrap}
  .clickable{cursor:pointer}

  /* ---------- Pills ---------- */
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}
  .p-ok{color:var(--ok);background:var(--ok-bg)} .p-warn{color:var(--warn);background:var(--warn-bg)}
  .p-crit{color:var(--crit);background:var(--crit-bg)} .p-info{color:var(--green-soft);background:var(--info-bg)}
  .p-taupe{color:var(--taupe);background:var(--taupe-tint)}

  /* ---------- Forms ---------- */
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
  .field label{font-size:.8rem;font-weight:600;color:var(--ink-soft)}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--hair);
    border-radius:9px;background:var(--panel-2);color:var(--ink);transition:border .15s}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-tint)}
  .field textarea{resize:vertical;min-height:64px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:520px){.frow{grid-template-columns:1fr}}
  .check{display:flex;gap:10px;align-items:flex-start;padding:12px;background:var(--ground-2);border-radius:9px;font-size:.85rem}
  .check input{margin-top:3px;width:16px;height:16px;flex:none;accent-color:var(--green)}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(30,26,20,.5);backdrop-filter:blur(3px);
    display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow:auto}
  .overlay.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow);
    width:100%;max-width:540px;overflow:hidden;animation:pop .2s ease}
  @keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal .mh{padding:18px 22px;border-bottom:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between}
  .modal .mh h3{font-size:1.15rem}
  .modal .mb{padding:20px 22px;max-height:66vh;overflow:auto}
  .modal .mf{padding:14px 22px;border-top:1px solid var(--hair);display:flex;justify-content:flex-end;gap:10px;background:var(--panel-2)}
  .x{border:0;background:transparent;font-size:1.5rem;line-height:1;color:var(--ink-soft);cursor:pointer;padding:0 4px}

  /* ---------- Detail ---------- */
  .back{background:transparent;border:0;color:var(--gold-deep);font-weight:600;font-size:.85rem;padding:0;margin-bottom:14px;cursor:pointer}
  .phero{display:flex;align-items:center;gap:18px;margin-bottom:20px;flex-wrap:wrap}
  .phero .avatar{width:60px;height:60px;font-size:1.4rem}
  .phero h1{font-size:1.7rem}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--hair);margin-bottom:20px;flex-wrap:wrap}
  .tabs button{border:0;background:transparent;padding:10px 15px;font-size:.9rem;font-weight:600;color:var(--ink-soft);
    border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
  .tabs button.active{color:var(--green);border-bottom-color:var(--gold)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;font-size:.9rem}
  .kv dt{color:var(--ink-soft)} .kv dd{margin:0;font-weight:600}

  .sess{border:1px solid var(--hair);border-radius:11px;padding:15px 17px;margin-bottom:12px;background:var(--panel-2)}
  .sess .st{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .sess .sd{font-weight:600}
  .sess .pay{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px dashed var(--hair);font-size:.85rem}
  .money{font-family:Georgia,serif;font-variant-numeric:tabular-nums}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  /* zona de upload (vazia) */
  .dz{display:flex;align-items:center;gap:13px;margin-top:10px;padding:13px 15px;border-radius:11px;
    border:1.5px dashed var(--hair);background:var(--ground-2);cursor:pointer;transition:.15s;text-align:left}
  .dz:hover{border-color:var(--gold);background:var(--gold-tint)}
  .dz.drag{border-color:var(--gold);background:var(--gold-tint);transform:scale(1.005)}
  .dz .dzic{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;
    background:var(--panel);border:1px solid var(--hair);font-size:1.15rem;color:var(--taupe)}
  .dz:hover .dzic,.dz.drag .dzic{color:var(--gold-deep);border-color:var(--gold)}
  .dz .dzt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .dz .dzt b{font-size:.87rem;font-weight:600;color:var(--ink)}
  .dz .dzt span{font-size:.75rem;color:var(--ink-soft)}
  .dz .dzcta{font-size:.8rem;font-weight:700;color:var(--gold-deep);padding:6px 12px;border-radius:8px;
    background:var(--panel);border:1px solid var(--hair);flex:none}
  /* comprovativo anexado */
  .att{display:flex;align-items:center;gap:13px;margin-top:10px;padding:11px 13px;border-radius:11px;
    background:var(--panel-2);border:1px solid var(--hair)}
  .att .thumb{width:46px;height:46px;border-radius:9px;flex:none;overflow:hidden;display:grid;place-items:center;
    background:var(--crit-bg)}
  .att .thumb img{width:100%;height:100%;object-fit:cover}
  .att .thumb .pdf{font-size:.68rem;font-weight:800;letter-spacing:.03em;color:var(--crit)}
  .att .ai{flex:1;min-width:0}
  .att .ai .an{font-size:.87rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .att .ai .am{font-size:.76rem;color:var(--ink-soft);display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:1px}
  .att .ai .am .ok{color:var(--ok);font-weight:700}
  .att .ai .am .sep{opacity:.5}
  .att .aa{display:flex;gap:6px;flex-wrap:wrap;flex:none}
  @media(max-width:520px){.att{flex-wrap:wrap}.att .aa{width:100%}}

  .empty{text-align:center;color:var(--ink-soft);padding:34px 16px;font-size:.9rem}
  .empty .em{font-size:1.7rem;display:block;margin-bottom:6px;opacity:.6}

  /* ---------- Toast ---------- */
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--green);color:#F4EEDF;padding:12px 20px;border-radius:11px;box-shadow:var(--shadow);
    font-size:.9rem;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;display:flex;gap:9px;align-items:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .hint{font-size:.82rem;color:var(--ink-soft);background:var(--gold-tint);border-radius:9px;padding:10px 13px;margin-bottom:16px;display:flex;gap:9px}
  .hint b{color:var(--gold-deep)}

  /* ---------- Login (modo online) ---------- */
  .login{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% -10%,var(--ground-2),var(--ground) 60%);padding:20px}
  .login.open{display:flex}
  .login .card{background:var(--panel);border:1px solid var(--hair);border-radius:18px;box-shadow:var(--shadow);
    width:100%;max-width:380px;padding:34px 30px;text-align:center}
  .login svg{width:74px;height:86px;margin-bottom:10px}
  .login h2{font-size:1.4rem;margin-bottom:2px}
  .login .ls{color:var(--ink-soft);font-size:.85rem;margin-bottom:22px}
  .login .field{text-align:left}
  .login .err{display:none;color:var(--crit);background:var(--crit-bg);border-radius:8px;padding:8px 12px;
    font-size:.82rem;margin-bottom:12px}
  .login .err.show{display:block}
  .login .btn{width:100%;justify-content:center;padding:12px}

<script>
(function(){
  "use strict";
  // ============ ESTADO (em memória — protótipo) ============
  var PLANOS = {
    avulsa:        {nome:"Consulta avulsa",         preco:15000, sessoes:1},
    acompanhamento:{nome:"Plano de acompanhamento", preco:35000, sessoes:3}
  };
  var TERMOS_DEFAULT=[
    "Toda a informação partilhada durante o processo terapêutico é tratada de forma confidencial, nos termos da ética e da legislação aplicáveis.",
    "A marcação é confirmada mediante o pagamento de 50% do valor da consulta.",
    "Tolerância máxima de 20 minutos. Após esse período, a consulta poderá ser cancelada sem direito a reembolso do valor pago.",
    "Cancelamentos ou pedidos de remarcação devem ser comunicados com pelo menos 24 horas de antecedência.",
    "Cancelamentos com menos de 24 horas de antecedência ou a não comparência implicam a perda do valor pago para reserva.",
    "A marcação e o pagamento da reserva constituem aceitação integral destes termos e políticas."
  ];
  var state = { patients:[], nextView:"inicio", currentPatient:null, patientTab:"dados",
    config:{ terms:TERMOS_DEFAULT.slice() } };
  function uid(){ return "id"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  window.APP={}; // ações da interface (criado já aqui para todas as funções se pendurarem)

  // ============ PERSISTÊNCIA (guarda no navegador) ============
  var STORE="crm_ivana_v1", loading=false;
  var canPersist=(function(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }catch(e){ return false; } })();
  var avisoEspaco=false;
  function persist(){ if(loading) return;
    // A7: em modo nuvem os dados clinicos NAO tocam no disco deste dispositivo.
    if(canPersist && !CLOUD.on){ try{ localStorage.setItem(STORE, JSON.stringify(snapshot())); avisoEspaco=false; }
      catch(e){ if(!avisoEspaco){ avisoEspaco=true;
        try{ toast("⚠ Sem espaço para guardar neste dispositivo — exporte uma cópia e remova anexos antigos"); }catch(_){} } } }
    cloudSave(); }

  // ============ NUVEM (login + sincronização) — ativa só com CRM_CONFIG ============
  var CLOUD={on:false,client:null,user:null,timer:null};
  var cloudReadOk=false, pendenteSync=false;
  var ultimoGravado=null, versaoLocal=null, emConflito=false;   // A8 + A24
  function cloudInit(){
    var cfg=window.CRM_CONFIG;
    if(!cfg||!cfg.url||!cfg.key||!window.supabase) return false;
    try{ CLOUD.client=window.supabase.createClient(cfg.url,cfg.key); CLOUD.on=true; return true; }
    catch(e){ return false; }
  }
  // Invariante: nunca escrever um objecto completo que nao veio de uma leitura bem sucedida.
  function cloudUpsert(){
    if(emConflito) return Promise.resolve();
    var snap=snapshot(), corpo=JSON.stringify(snap);
    if(corpo===ultimoGravado){ pendenteSync=false; return Promise.resolve(); }  // A24: render sem alteracao nao escreve

    var q = (versaoLocal===null)
      ? CLOUD.client.from("crm_dados").insert({user_id:CLOUD.user.id, dados:snap}).select("versao")
      : CLOUD.client.from("crm_dados").update({dados:snap})                     // A8: o servidor incrementa a versao
          .eq("user_id",CLOUD.user.id).eq("versao",versaoLocal).select("versao");

    return q.then(function(r){
      if(r.error){
        if(r.error.code==="23505") return diagnosticarConflito();               // outro dispositivo criou a linha
        toast("⚠ Falha ao sincronizar — verifique a Internet"); return;
      }
      if(!r.data || !r.data.length) return diagnosticarConflito();              // 0 linhas: investigar porque
      versaoLocal=r.data[0].versao; ultimoGravado=corpo; pendenteSync=false;
    }).catch(function(){ toast("⚠ Falha ao sincronizar — verifique a Internet"); });
  }
  // Distingue conflito de versao, linha ausente e falha de ligacao. pendenteSync fica true de proposito:
  // o beforeunload avisa se a utilizadora tentar fechar antes de exportar.
  function diagnosticarConflito(){
    return CLOUD.client.from("crm_dados").select("versao").eq("user_id",CLOUD.user.id).maybeSingle()
      .then(function(r){
        if(r.error){ toast("⚠ Não foi possível gravar. Verifique a ligação."); return; }
        emConflito=true;
        modalConflito(r.data ? "outro" : "ausente");
      }).catch(function(){ toast("⚠ Não foi possível gravar. Verifique a ligação."); });
  }
  function modalConflito(tipo){
    var txt = (tipo==="outro")
      ? "Os seus dados foram alterados <b>noutro dispositivo</b>. As alterações que fez aqui <b>não foram gravadas</b>."
      : "O registo já não está acessível nesta conta. As alterações que fez aqui <b>não foram gravadas</b>.";
    openModal(modal("Alterações não gravadas",
      '<p style="margin:0;font-size:.93rem;line-height:1.6">'+txt+
      ' Pode guardar uma cópia antes de recarregar.</p>',
      '<button class="btn gold" onclick="APP.exportar()">⬇ Exportar as minhas alterações</button>'+
      '<button class="btn dgr" onclick="location.reload()">Recarregar com os dados do servidor</button>'));
  }
  function cloudSave(){                       // com debounce
    if(!CLOUD.on||!CLOUD.user||!cloudReadOk) return;
    pendenteSync=true;
    clearTimeout(CLOUD.timer);
    CLOUD.timer=setTimeout(cloudUpsert,800);
  }
  function cloudSaveNow(){                    // imediato, dispensa o debounce
    if(!CLOUD.on||!CLOUD.user||!cloudReadOk) return;
    clearTimeout(CLOUD.timer);
    cloudUpsert();
  }
  // fecho automático de sessão após 30 min sem atividade (só no modo online)
  var IDLE_MS=30*60*1000, idleT=null;
  function armIdle(){ if(!CLOUD.on||!CLOUD.user) return; clearTimeout(idleT);
    idleT=setTimeout(function(){ CLOUD.client.auth.signOut().then(function(){ location.reload(); }); }, IDLE_MS); }
  document.addEventListener("pointerdown",armIdle);
  document.addEventListener("keydown",armIdle);
  function loginErr(m){ var e=document.getElementById("loginErr"); e.textContent=m; e.classList.add("show"); }
  function showLogin(){ document.getElementById("login").classList.add("open"); }
  function hideLogin(){ document.getElementById("login").classList.remove("open"); }
  function cloudFetch(){
    CLOUD.client.from("crm_dados").select("dados,versao").eq("user_id",CLOUD.user.id).maybeSingle()
      .then(function(r){
        if(r.error){ cloudReadOk=false;
          loginErr("Não foi possível carregar os dados. Verifique a ligação e recarregue."); return; }
        cloudReadOk=true;                                  // leitura confirmada
        versaoLocal = r.data ? r.data.versao : null;       // A8: base da concorrencia optimista
        loading=true;
        try{ localStorage.removeItem(STORE); }catch(e){}   // purga cache de versoes anteriores (A7)
        if(r.data && r.data.dados){
          aplicar(r.data.dados);
          ultimoGravado=JSON.stringify(snapshot());        // A24: base de comparacao verdadeira
        } else {                                           // conta nova: arranca vazia (A17)
          state.patients=[]; state.currentPatient=null;
          state.config={ terms:TERMOS_DEFAULT.slice() };
          PLANOS.avulsa.preco=15000; PLANOS.acompanhamento.preco=35000;
          ultimoGravado=null;                              // null: o insert da conta nova nao e deduplicado
        }
        loading=false;
        hideLogin(); updateBadges(); render("inicio"); armIdle();
        if(!r.data) cloudSaveNow();                        // so cria a linha da conta nova
      })
      .catch(function(){ cloudReadOk=false;
        loginErr("Falha de ligação. Verifique a Internet e recarregue."); });
  }
  function cloudBoot(){
    var rb=document.getElementById("resetBtn"); if(rb) rb.style.display="none";  // A17
    showLogin();
    var btn=document.getElementById("loginBtn");
    var tenta=function(){
      var em=document.getElementById("loginEmail").value.trim();
      var pw=document.getElementById("loginPass").value;
      if(!em||!pw){ loginErr("Preencha o e-mail e a senha."); return; }
      btn.disabled=true; btn.textContent="A entrar…";
      CLOUD.client.auth.signInWithPassword({email:em,password:pw}).then(function(r){
        btn.disabled=false; btn.textContent="Entrar";
        if(r.error){ loginErr("E-mail ou senha incorretos."); return; }
        CLOUD.user=r.data.user; cloudFetch();
      });
    };
    btn.addEventListener("click",tenta);
    document.getElementById("loginPass").addEventListener("keydown",function(e){ if(e.key==="Enter") tenta(); });
    CLOUD.client.auth.getSession().then(function(r){
      if(r.data&&r.data.session){ CLOUD.user=r.data.session.user; cloudFetch(); }
    });
  }
  function snapshot(){ return {patients:state.patients, config:state.config,
    precos:{avulsa:PLANOS.avulsa.preco, acompanhamento:PLANOS.acompanhamento.preco}}; }
  function migrarAnexos(patients){
    (patients||[]).forEach(function(p){ (p.sessoes||[]).forEach(function(s){
      if(!s.pagamento.anexos) s.pagamento.anexos={reserva:null,saldo:null};
    }); });
  }
  function aplicar(d){ if(!d)return false;
    if(d.patients){ migrarAnexos(d.patients); state.patients=d.patients; }
    if(d.config) state.config=d.config;
    if(!state.config.terms||!state.config.terms.length) state.config.terms=TERMOS_DEFAULT.slice();
    if(d.precos){ if(d.precos.avulsa)PLANOS.avulsa.preco=d.precos.avulsa; if(d.precos.acompanhamento)PLANOS.acompanhamento.preco=d.precos.acompanhamento; }
    return !!(d.patients&&d.patients.length); }
  function load(){ if(!canPersist) return false; try{ var raw=localStorage.getItem(STORE); if(!raw) return false;
    return aplicar(JSON.parse(raw)); }catch(e){} return false; }

  // ---- dados de exemplo (para a Dr.ª ver logo algo real) ----
  function seed(){
    var p1 = novoPaciente("Ana Sofia Mendes","1991-03-14","+244 923 111 222",true);
    p1.estado="ativo"; p1.motivo="Ansiedade e stress no trabalho";
    p1.diagnostico="Perturbação de ansiedade generalizada (a confirmar)";
    p1.objetivos="Reduzir ruminação; técnicas de gestão de ansiedade";
    var s1 = novaSessao(p1,"acompanhamento","presencial", diasFrente(-6), 9);
    s1.pagamento.estado="liquidado"; recalcPag(s1.pagamento); s1.estado="realizada";
    s1.nota={queixa:"Insónia e preocupação constante",temas:"Rotina, sono, autocrítica",
      intervencoes:"Reestruturação cognitiva; registo de pensamentos",evolucao:"Boa adesão, mais consciente dos gatilhos",
      homework:"Diário de pensamentos 5 min/dia",plano:"Introduzir relaxamento respiratório"};
    var s2 = novaSessao(p1,"acompanhamento","presencial", diasFrente(1)+0.375, 0);
    s2.pagamento.estado="reserva_paga"; s2.pagamento.metodo="bai"; recalcPag(s2.pagamento); s2.estado="confirmada";

    var p2 = novoPaciente("Miguel Fontes","1986-11-02","+244 991 555 777",true);
    p2.estado="ativo"; p2.motivo="Dificuldades de relacionamento";
    var s3 = novaSessao(p2,"avulsa","online", diasFrente(0)+0.5, 0);
    s3.pagamento.estado="pendente"; recalcPag(s3.pagamento);

    novoPaciente("Joana Pires","1998-07-21","+244 924 888 999",false).estado="lead";
  }

  // ============ LÓGICA DE NEGÓCIO ============
  function novoPaciente(nome,nasc,tel,termos){
    var p={id:uid(),nome:nome,nascimento:nasc,telefone:tel,
      termos:!!termos, termosData:termos?hoje():null,
      primeira:null, estado:"lead", motivo:"",diagnostico:"",objetivos:"", sessoes:[]};
    state.patients.push(p); return p;
  }
  function novaSessao(p,plano,modalidade,dataFrac){
    var pl=PLANOS[plano];
    var s={id:uid(), plano:plano, modalidade:modalidade, data:dataFrac,
      estado:"agendada",
      pagamento:{total:pl.preco, reserva:0, saldo:0, estado:"pendente", metodo:null,
        anexos:{reserva:null, saldo:null}},
      nota:null};
    recalcPag(s.pagamento);
    p.sessoes.push(s);
    if(!p.primeira) p.primeira=dataFrac;
    return s;
  }
  function recalcPag(pg){
    pg.reserva = Math.round(pg.total*0.5);
    pg.saldo = (pg.estado==="liquidado") ? 0 : pg.total - pg.reserva;
  }
  // regra: reserva paga -> sessão confirmada
  function registarReserva(p,s){
    s.pagamento.estado="reserva_paga";
    if(!s.pagamento.metodo) s.pagamento.metodo="bai";
    recalcPag(s.pagamento);
    if(s.estado==="agendada") s.estado="confirmada";
    toast("Reserva de 50% registada — consulta confirmada"); refresh();
  }
  function registarSaldo(p,s){
    s.pagamento.estado="liquidado"; recalcPag(s.pagamento);
    toast("Saldo liquidado — pagamento completo"); refresh();
  }
  // regra: sessão realizada -> cria nota clínica em branco
  function marcarRealizada(p,s){
    s.estado="realizada";
    if(!s.nota) s.nota={queixa:"",temas:"",intervencoes:"",evolucao:"",homework:"",plano:""};
    if(p.estado==="lead") p.estado="ativo";
    toast("Sessão realizada — nota clínica criada"); refresh();
  }

  // ============ HELPERS ============
  function hoje(){return new Date().toISOString().slice(0,10)}
  function diasFrente(n){ // devolve fração de dias a partir de hoje 00:00, base p/ ordenação
    return Math.floor(Date.now()/864e5)+n;
  }
  function dataObj(frac){ return new Date(Math.round(frac*864e5)); }
  function fmtData(frac){
    var d=dataObj(frac);
    var dias=["dom","seg","ter","qua","qui","sex","sáb"];
    var meses=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
    var hh=String(d.getHours()).padStart(2,"0"), mm=String(d.getMinutes()).padStart(2,"0");
    return dias[d.getDay()]+", "+d.getDate()+" "+meses[d.getMonth()]+" · "+hh+"h"+mm;
  }
  function kz(n){return n.toLocaleString("pt-PT")+" Kz"}
  function idade(nasc){ if(!nasc)return"—"; var d=new Date(nasc),h=new Date();
    var a=h.getFullYear()-d.getFullYear(); if(h.getMonth()<d.getMonth()||(h.getMonth()==d.getMonth()&&h.getDate()<d.getDate()))a--; return a+" anos"; }
  function inicial(nome){return nome.trim().charAt(0).toUpperCase()}
  function esc(s){return (s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function todayFloor(){return Math.floor(Date.now()/864e5)}
  function saudacao(){var h=new Date().getHours();return h<12?"Bom dia":h<20?"Boa tarde":"Boa noite"}
  function primeiro(nome){return (nome||"").trim().split(" ")[0]}
  // sessão ainda gera receita? (exclui canceladas, perdas de reserva e faltas)
  function aindaCobra(s){return s.estado!=="cancelada"&&s.estado!=="perda_reserva"&&s.estado!=="falta"}
  // compara com o dia de HOJE na hora local (não UTC)
  function mesmoDiaHoje(frac){var a=dataObj(frac),b=new Date();
    return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
  function byId(id){return state.patients.filter(function(x){return x.id===id})[0]}

  // ---- Mensagens (enviadas por WhatsApp, a partir da app) ----
  function digits(s){return (s||"").replace(/\D/g,"")}
  function waLink(tel,msg){return "https://wa.me/"+digits(tel)+"?text="+encodeURIComponent(msg)}
  function sendWa(tel,msg){ var w=null; try{ w=window.open(waLink(tel,msg),"_blank"); }catch(e){}
    if(!w) copiar(msg,"Não foi possível abrir o WhatsApp aqui — mensagem copiada. Cole no WhatsApp."); else toast("A abrir o WhatsApp…"); }
  function copiar(txt,okMsg){ try{ if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast(okMsg||"Mensagem copiada")},function(){fbCopy(txt,okMsg)}); return; } }catch(e){}
    fbCopy(txt,okMsg); }
  function fbCopy(txt,okMsg){ var t=document.createElement("textarea"); t.value=txt; t.style.position="fixed"; t.style.opacity="0";
    document.body.appendChild(t); t.select(); try{document.execCommand("copy");toast(okMsg||"Mensagem copiada")}catch(e){toast("Copie a mensagem manualmente")} t.remove(); }
  function msgTermos(p){
    var linhas=(state.config.terms||[]).map(function(x,i){return (i+1)+". "+x}).join("\n");
    return "Olá "+primeiro(p.nome)+"! 🌿 Bem-vindo(a) ao consultório da Dr.ª Ivana Anapaz, Psicóloga Clínica.\n\n"+
      "Antes da primeira consulta, partilho os Termos e Condições de Atendimento:\n\n"+linhas+
      "\n\nA marcação e o pagamento da reserva (50%) confirmam a aceitação destes termos. Fico à disposição para qualquer dúvida. 💛"; }
  function msgLembrete(p,s){ return "Olá "+primeiro(p.nome)+", este é um lembrete da sua consulta com a Dr.ª Ivana Anapaz em "+
      fmtData(s.data)+" ("+(s.modalidade==="online"?"online":"presencial")+"). Confirma a sua presença? 🌿"; }
  function msgReserva(p,s){ return "Olá "+primeiro(p.nome)+", para confirmar a sua consulta de "+fmtData(s.data)+
      ", agradeço o pagamento da reserva de 50% ("+kz(s.pagamento.reserva)+") e o envio do comprovativo (BAI/Express). Obrigada! 💛"; }
  function msgRenov(p){ return "Olá "+primeiro(p.nome)+", o seu plano de acompanhamento está a chegar ao fim do ciclo. Deseja renovar para o próximo mês? 🌿"; }

  var ESTADO_SESSAO={agendada:["A confirmar","p-warn"],confirmada:["Confirmada","p-info"],
    realizada:["Realizada","p-ok"],cancelada:["Cancelada","p-crit"],falta:["Falta","p-crit"],perda_reserva:["Perda de reserva","p-crit"]};
  var ESTADO_PAG={pendente:["Pagamento pendente","p-crit"],reserva_paga:["Reserva paga (50%)","p-warn"],
    liquidado:["Liquidado","p-ok"]};
  var ESTADO_PAC={lead:["Novo contacto","p-taupe"],ativo:["Ativo","p-ok"],inativo:["Inativo","p-info"],alta:["Alta","p-info"]};

  function allSessions(){ var out=[]; state.patients.forEach(function(p){p.sessoes.forEach(function(s){out.push({p:p,s:s})})}); return out; }
  function pill(txt,cls){return '<span class="pill '+cls+'"><span class="d"></span>'+txt+'</span>'}

  // ============ RENDER ============
  var main=document.getElementById("main");
  function refresh(){ persist(); render(state.nextView); updateBadges(); }
  function updateBadges(){
    document.getElementById("bg-pac").textContent=state.patients.length;
    document.getElementById("bg-lem").textContent=lembretes().length;
  }
  function setView(v){
    persist(); updateBadges();
    state.nextView=v;
    [].forEach.call(document.querySelectorAll("#nav button"),function(b){b.classList.toggle("active",b.dataset.view===v)});
    render(v);
  }
  function render(v){
    if(state.currentPatient && v==="_detalhe"){ return renderDetalhe(); }
    if(v==="inicio")     return renderInicio();
    if(v==="pacientes")  return renderPacientes();
    if(v==="agenda")     return renderAgenda();
    if(v==="financeiro") return renderFinanceiro();
    if(v==="lembretes")  return renderLembretes();
    if(v==="definicoes") return renderDefinicoes();
  }

      '<div style="height:22px"></div>'+
      panel("Termos e Condições de Atendimento",
        '<div style="padding:14px 16px">'+
        '<p style="color:var(--ink-soft);font-size:.86rem;margin:0 0 10px">Uma regra por linha. São estes termos que a app envia ao paciente nas boas-vindas.</p>'+
        '<div class="field"><textarea id="cfg_terms" style="min-height:180px">'+esc(terms)+'</textarea></div>'+
        '<div style="display:flex;gap:9px"><button class="btn gold sm" onclick="APP.salvarTermos()">Guardar termos</button>'+
        '<button class="btn sm" onclick="APP.verTermos()">👁 Ver como o paciente recebe</button></div></div>',
        '<button class="btn sm" onclick="APP.verTermos()">Pré-visualizar</button>');

  APP.reporDemo=function(){
    if(CLOUD.on){ toast("Indisponível em modo online"); return; }
    APP.confirmar("Repor demonstração",
      "Isto apaga <b>todos os dados que introduziu</b> e volta aos pacientes de exemplo. Não pode ser desfeito.",
      "Repor tudo",
      function(){
        state.patients=[]; state.currentPatient=null; state.config.terms=TERMOS_DEFAULT.slice();
        loading=true; seed(); loading=false; persist(); setView("inicio"); toast("Demonstração reposta");
      }); };

  // ---- INÍCIO ----
  function renderInicio(){
    var sess=allSessions();
    var hojeSess=sess.filter(function(x){return mesmoDiaHoje(x.s.data) && x.s.estado!=="cancelada"});
    var aConfirmar=sess.filter(function(x){return x.s.estado==="agendada"});
    var pendentes=sess.filter(function(x){return x.s.pagamento.estado==="pendente" && aindaCobra(x.s)});
    var receber=sess.filter(function(x){return x.s.pagamento.estado!=="liquidado" && aindaCobra(x.s)})
                    .reduce(function(a,x){return a+(x.s.pagamento.estado==="pendente"?x.s.pagamento.total:x.s.pagamento.saldo)},0);
    var proximas=sess.filter(function(x){return x.s.data>=todayFloor()&&x.s.estado!=="cancelada"&&x.s.estado!=="realizada"})
                     .sort(function(a,b){return a.s.data-b.s.data}).slice(0,5);

    main.innerHTML=
      head("Início",saudacao()+", Dr.ª Ivana. Aqui está o seu consultório hoje.",
        '<button class="btn gold" onclick="APP.novoPaciente()">＋ Novo paciente</button>')+
      '<div class="stats">'+
        stat("Sessões hoje",hojeSess.length,"◔","")+
        stat("A confirmar",aConfirmar.length,"◕", aConfirmar.length?"aguardam reserva":"tudo confirmado")+
        stat("Pagamentos pendentes",pendentes.length,"₭", pendentes.length?"sem comprovativo":"em dia")+
        statMoney("A receber",kz(receber),"◷")+
      '</div>'+
      '<div class="grid2">'+
        panel("Próximas sessões", proximas.length?proximas.map(function(x){return sessRow(x.p,x.s)}).join(""):emptyBox("Sem sessões agendadas"))+
        panel("Lembretes automáticos", lembretesHTML(4))+
      '</div>';
  }

  // ---- PACIENTES ----
  APP.pesquisar=function(v){ state.q=v; renderPacientes();
    var i=document.getElementById("q"); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } };
  function renderPacientes(){
    var q=(state.q||"").toLowerCase().trim();
    var lista=q ? state.patients.filter(function(p){
      return p.nome.toLowerCase().indexOf(q)>=0 || (p.telefone||"").replace(/\s/g,"").indexOf(q.replace(/\s/g,""))>=0;
    }) : state.patients;
    var rows=lista.map(function(p){
      var prox=p.sessoes.filter(function(s){return s.data>=todayFloor()&&s.estado!=="cancelada"&&s.estado!=="realizada"}).sort(function(a,b){return a.data-b.data})[0];
      return '<div class="row clickable" onclick="APP.abrir(\''+p.id+'\')">'+
        '<div class="avatar">'+inicial(p.nome)+'</div>'+
        '<div class="who"><div class="n">'+esc(p.nome)+'</div><div class="m">'+idade(p.nascimento)+' · '+esc(p.telefone)+'</div></div>'+
        '<div class="meta">'+pill.apply(null,ESTADO_PAC[p.estado])+'<div style="margin-top:5px">'+(prox?fmtData(prox.data):"—")+'</div></div>'+
      '</div>';
    }).join("");
    main.innerHTML=
      head("Pacientes",state.patients.length+" registados",'<button class="btn gold" onclick="APP.novoPaciente()">＋ Novo paciente</button>')+
      '<input class="search" id="q" type="search" placeholder="🔍 Pesquisar por nome ou contacto…" value="'+esc(state.q||"")+'" oninput="APP.pesquisar(this.value)">'+
      panel(q?lista.length+" resultado(s) para “"+esc(state.q)+"”":"Todos os pacientes",
        rows||(q?emptyBox("Nenhum paciente corresponde à pesquisa."):emptyBox("Ainda sem pacientes. Comece por adicionar um.")));
  }

  // ---- AGENDA ----
  function renderAgenda(){
    var sess=allSessions().filter(function(x){return x.s.estado!=="cancelada"}).sort(function(a,b){return a.s.data-b.s.data});
    var fut=sess.filter(function(x){return x.s.data>=todayFloor()});
    var pas=sess.filter(function(x){return x.s.data<todayFloor()});
    main.innerHTML=
      head("Agenda","Todas as sessões, por data")+
      panel("Próximas", fut.length?fut.map(function(x){return sessRow(x.p,x.s,true)}).join(""):emptyBox("Sem sessões futuras"))+
      '<div style="height:22px"></div>'+
      panel("Anteriores", pas.length?pas.map(function(x){return sessRow(x.p,x.s,true)}).join(""):emptyBox("Sem histórico"));
  }

  // ---- FINANCEIRO ----
  function renderFinanceiro(){
    var sess=allSessions().filter(function(x){return x.s.estado!=="cancelada"});
    var recebido=sess.filter(function(x){return x.s.pagamento.estado==="liquidado"}).reduce(function(a,x){return a+x.s.pagamento.total},0)
                +sess.filter(function(x){return x.s.pagamento.estado==="reserva_paga"}).reduce(function(a,x){return a+x.s.pagamento.reserva},0);
    var aReceber=sess.filter(function(x){return x.s.pagamento.estado!=="liquidado" && aindaCobra(x.s)}).reduce(function(a,x){return a+(x.s.pagamento.estado==="pendente"?x.s.pagamento.total:x.s.pagamento.saldo)},0);
    var rows=sess.sort(function(a,b){return b.s.data-a.s.data}).map(function(x){
      var pg=x.s.pagamento;
      return '<div class="row">'+
        '<div class="avatar">'+inicial(x.p.nome)+'</div>'+
        '<div class="who"><div class="n">'+esc(x.p.nome)+'</div><div class="m">'+PLANOS[x.s.plano].nome+' · '+fmtData(x.s.data)+'</div></div>'+
        '<div class="meta"><div class="money" style="font-size:.95rem;color:var(--ink);font-weight:700">'+kz(pg.total)+'</div>'+
        '<div style="margin-top:5px">'+pill.apply(null,ESTADO_PAG[pg.estado])+'</div></div>'+
      '</div>';
    }).join("");
    main.innerHTML=
      head("Financeiro","Reserva de 50% + saldo, por sessão")+
      '<div class="stats">'+statMoney("Recebido / confirmado",kz(recebido),"✓")+statMoney("A receber",kz(aReceber),"◷")+
        stat("Sessões",sess.length,"◔","")+'</div>'+
      panel("Movimentos", rows||emptyBox("Sem movimentos"));
  }

  // ---- LEMBRETES ----
  function renderLembretes(){
    main.innerHTML=
      head("Lembretes automáticos","O sistema avisa sozinho — a Dr.ª não precisa de se lembrar")+
      '<div class="hint"><span>⟳</span><div>Estes lembretes seriam enviados por <b>WhatsApp / SMS</b> à hora certa. Aqui mostramos o que está agendado.</div></div>'+
      panel("Agendados", lembretesHTML(50));

  // ============ COMPONENTES ============
  function head(t,s,right){
    return '<div class="head"><div><h1>'+t+'</h1><p>'+s+'</p></div>'+(right||"")+'</div>';
  }
  function stat(k,v,ic,sub){return '<div class="stat"><div class="k"><span>'+ic+'</span>'+k+'</div><div class="v">'+v+'</div><div class="sub">'+(sub||"&nbsp;")+'</div></div>'}
  function statMoney(k,v,ic){return '<div class="stat"><div class="k"><span>'+ic+'</span>'+k+'</div><div class="v money" style="font-size:1.5rem">'+v+'</div></div>'}
  function panel(title,body,right){return '<div class="panel"><div class="ph"><h3>'+title+'</h3>'+(right||"")+'</div><div class="pb">'+body+'</div></div>'}
  function emptyBox(t){return '<div class="empty"><span class="em">◌</span>'+t+'</div>'}

  function sessRow(p,s,showState){
    var pg=s.pagamento;
    return '<div class="row clickable" onclick="APP.abrir(\''+p.id+'\',\'sessoes\')">'+
      '<div class="avatar">'+inicial(p.nome)+'</div>'+
      '<div class="who"><div class="n">'+esc(p.nome)+'</div><div class="m">'+fmtData(s.data)+' · '+(s.modalidade==="online"?"Online":"Presencial")+'</div></div>'+
      '<div class="meta">'+pill.apply(null,ESTADO_SESSAO[s.estado])+
        '<div style="margin-top:5px">'+pill.apply(null,ESTADO_PAG[pg.estado])+'</div></div>'+
    '</div>';
  }

  // ---- lembretes derivados ----
  function lembretes(){
    var L=[];
    allSessions().forEach(function(x){
      var s=x.s, dt=s.data;
      var msAte=s.data*864e5-Date.now();
      if(s.estado!=="cancelada" && s.estado!=="realizada" && msAte>=0 && msAte<=864e5){
        L.push({acao:"lembrete",pid:x.p.id,sid:s.id,txt:"Lembrete de sessão — "+x.p.nome,quando:fmtData(dt),
          det:"Enviar aviso 24h antes. "+(s.modalidade==="online"?"Consulta online":"Consulta presencial"),cls:"p-info"});
      }
      if(s.pagamento.estado==="pendente" && aindaCobra(s)){
        L.push({acao:"reserva",pid:x.p.id,sid:s.id,txt:"Reserva por pagar — "+x.p.nome,quando:fmtData(dt),
          det:"Aguarda comprovativo de 50% ("+kz(s.pagamento.reserva)+") para confirmar.",cls:"p-warn"});
      }
    });
    state.patients.forEach(function(p){
      var temAcomp=p.sessoes.some(function(s){return s.plano==="acompanhamento"});
      if(temAcomp && p.estado==="ativo") L.push({acao:"renov",pid:p.id,txt:"Renovação de plano — "+p.nome,quando:"Fim do mês",
        det:"Plano de acompanhamento (3 sessões/mês) a renovar.",cls:"p-taupe"});
      if(!p.termos && p.estado==="lead") L.push({acao:"termos",pid:p.id,txt:"Termos por aceitar — "+p.nome,quando:"Antes da 1.ª consulta",
        det:"Enviar boas-vindas + Termos e Condições e registar aceite.",cls:"p-crit"});
    });
    return L;
  }
  function waBtn(l){
    var call={ lembrete:"APP.waLembrete('"+l.pid+"','"+l.sid+"')", reserva:"APP.waReserva('"+l.pid+"','"+l.sid+"')",
      renov:"APP.waRenov('"+l.pid+"')", termos:"APP.waTermos('"+l.pid+"',true)" }[l.acao];
    return '<button class="btn wa sm" onclick="'+call+'">✆ WhatsApp</button>';
  }
  function lembretesHTML(max){
    var L=lembretes().slice(0,max);
    if(!L.length) return emptyBox("Tudo em dia. Sem lembretes pendentes.");
    return L.map(function(l){
      return '<div class="row"><div class="avatar" style="background:var(--info-bg);color:var(--green-soft)">⟳</div>'+
        '<div class="who"><div class="n">'+esc(l.txt)+'</div><div class="m">'+l.det+'</div></div>'+
        '<div class="meta" style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">'+pill(l.quando,l.cls)+waBtn(l)+'</div></div>';
    }).join("");
  }

  // ============ DETALHE DO PACIENTE ============
  APP.sair=function(){ if(!CLOUD.on){toast("Modo local — sem sessão");return;}
    CLOUD.client.auth.signOut().then(function(){ location.reload(); }); };
  APP.abrir=function(id,tab){ state.currentPatient=id; state.patientTab=tab||"dados"; state.nextView="_detalhe"; renderDetalhe(); };
  APP.voltar=function(){ state.currentPatient=null; setView("pacientes"); };
  APP.tab=function(t){ state.patientTab=t; renderDetalhe(); };

  function P(){ return state.patients.filter(function(p){return p.id===state.currentPatient})[0]; }

  function renderDetalhe(){
    var p=P(); if(!p) return setView("pacientes");
    persist();
    var tab=state.patientTab;
    var body="";
    if(tab==="dados") body=tabDados(p);
    if(tab==="prontuario") body=tabProntuario(p);
    if(tab==="sessoes") body=tabSessoes(p);

    main.innerHTML=
      '<button class="back" onclick="APP.voltar()">‹ Voltar aos pacientes</button>'+
      '<div class="phero"><div class="avatar">'+inicial(p.nome)+'</div>'+
        '<div style="flex:1"><h1>'+esc(p.nome)+'</h1>'+
        '<div style="color:var(--ink-soft);font-size:.9rem;margin-top:2px">'+idade(p.nascimento)+' · '+esc(p.telefone)+'</div></div>'+
        pill.apply(null,ESTADO_PAC[p.estado])+'</div>'+
      '<div class="tabs">'+
        tabBtn("dados","Dados")+tabBtn("prontuario","Prontuário clínico")+tabBtn("sessoes","Sessões & Pagamentos")+
      '</div>'+ body;
  }
  function tabBtn(t,label){return '<button class="'+(state.patientTab===t?"active":"")+'" onclick="APP.tab(\''+t+'\')">'+label+'</button>'}

  function tabDados(p){
    return '<div class="grid2">'+
      panel("Identificação",
        '<div style="padding:10px 14px"><dl class="kv">'+
        '<dt>Nome completo</dt><dd>'+esc(p.nome)+'</dd>'+
        '<dt>Data de nascimento</dt><dd>'+(p.nascimento||"—")+'</dd>'+
        '<dt>Idade</dt><dd>'+idade(p.nascimento)+'</dd>'+
        '<dt>Contacto</dt><dd>'+esc(p.telefone)+'</dd>'+
        '<dt>1.ª consulta</dt><dd>'+(p.primeira?fmtData(p.primeira).split(" · ")[0]:"—")+'</dd>'+
        '</dl></div>',
        '<button class="btn sm" onclick="APP.editarPaciente(\''+p.id+'\')">✎ Editar</button>')+
      panel("Termos e Condições",
        '<div style="padding:14px;display:grid;gap:11px">'+
        (p.termos
          ? '<div class="pill p-ok"><span class="d"></span>Aceites</div><p style="color:var(--ink-soft);font-size:.85rem;margin:0">Aceitou os Termos e Condições em '+p.termosData+'. Boas-vindas enviadas.</p>'+
            '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn wa sm" onclick="APP.waTermos(\''+p.id+'\',false)">✆ Reenviar por WhatsApp</button>'+
            '<button class="btn sm" onclick="APP.verTermos()">👁 Ver termos</button></div>'
          : '<div class="pill p-crit"><span class="d"></span>Por aceitar</div><p style="color:var(--ink-soft);font-size:.85rem;margin:0">Enviar boas-vindas com os Termos antes da 1.ª consulta. Ao enviar, o aceite fica registado.</p>'+
            '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn wa sm" onclick="APP.waTermos(\''+p.id+'\',true)">✆ Enviar por WhatsApp &amp; registar</button>'+
            '<button class="btn sm" onclick="APP.copiarTermos(\''+p.id+'\')">⧉ Copiar</button>'+
            '<button class="btn sm" onclick="APP.enviarTermos(\''+p.id+'\')">✓ Só registar aceite</button></div>')+
        '</div>')+
    '</div>'+
    '<div class="danger">'+
      '<div class="dt"><b>Apagar este paciente</b><span>Remove a ficha, todas as sessões, notas clínicas e comprovativos. Esta ação não pode ser desfeita.</span></div>'+
      '<button class="btn dgr sm" onclick="APP.apagarPaciente(\''+p.id+'\')">🗑 Apagar paciente</button>'+
    '</div>';
  }

  APP.enviarTermos=function(id){ var p=state.patients.filter(function(x){return x.id===id})[0];
    p.termos=true; p.termosData=hoje(); toast("Boas-vindas enviadas — aceite registado"); renderDetalhe(); updateBadges(); };

  APP.editarPaciente=function(pid){
    var p=byId(pid); if(!p) return;
    var opts=["lead","ativo","inativo","alta"].map(function(k){
      return '<option value="'+k+'"'+(p.estado===k?" selected":"")+'>'+ESTADO_PAC[k][0]+'</option>'}).join("");
    openModal(modal("Editar dados do paciente",
      '<div class="field"><label>Nome completo</label><input id="e_nome" value="'+esc(p.nome)+'"></div>'+
      '<div class="frow"><div class="field"><label>Data de nascimento</label><input id="e_nasc" type="date" value="'+(p.nascimento||"")+'"></div>'+
      '<div class="field"><label>Contacto telefónico</label><input id="e_tel" value="'+esc(p.telefone)+'"></div></div>'+
      '<div class="field"><label>Estado do paciente</label><select id="e_est">'+opts+'</select></div>',
      '<button class="btn ghost" onclick="APP.close()">Cancelar</button><button class="btn gold" onclick="APP.salvarEdicaoPaciente(\''+pid+'\')">Guardar alterações</button>'));
  };
  APP.salvarEdicaoPaciente=function(pid){
    var p=byId(pid); if(!p) return;
    var nome=val("e_nome"), tel=val("e_tel");
    if(!nome||!tel){ toast("Nome e contacto são obrigatórios"); return; }
    p.nome=nome; p.telefone=tel; p.nascimento=val("e_nasc")||p.nascimento;
    p.estado=val("e_est")||p.estado;
    persist(); APP.close(); toast("Dados atualizados"); renderDetalhe(); updateBadges();
  };

  APP.apagarPaciente=function(id){
    var p=byId(id); if(!p) return;
    var n=(p.sessoes||[]).length;
    APP.confirmar("Apagar paciente",
      "Apagar <b>"+esc(p.nome)+"</b>?<br><br>Remove a ficha, <b>"+n+" sessão(ões)</b>, todas as notas clínicas e comprovativos. <b>Esta ação não pode ser desfeita.</b>",
      "Apagar definitivamente",
      function(){
        state.patients=state.patients.filter(function(x){return x.id!==id});
        state.currentPatient=null; persist(); updateBadges();
        toast("Paciente \""+p.nome+"\" apagado"); setView("pacientes");
      });
  };

  function tabProntuario(p){
    return panel("Enquadramento inicial",
        '<div style="padding:6px 14px">'+
        campoTexto("Motivo da consulta",p.motivo)+
        campoTexto("Diagnóstico",p.diagnostico)+
        campoTexto("Objetivos terapêuticos",p.objetivos)+
        '<button class="btn sm" onclick="APP.editEnquadramento(\''+p.id+'\')">✎ Editar enquadramento</button>'+
        '</div>')+
      '<div style="height:22px"></div>'+
      panel("Notas por sessão (TCC)",
        p.sessoes.filter(function(s){return s.nota}).length
        ? p.sessoes.filter(function(s){return s.nota}).sort(function(a,b){return b.data-a.data}).map(function(s){return notaCard(p,s)}).join("")
        : emptyBox("As notas aparecem aqui depois de cada sessão realizada."));
  }
  function campoTexto(l,v){return '<div style="margin-bottom:13px"><div style="font-size:.78rem;color:var(--ink-soft);font-weight:600;margin-bottom:2px">'+l+'</div><div>'+(esc(v)||'<span style="color:var(--ink-soft)">—</span>')+'</div></div>'}
  function notaCard(p,s){
    var n=s.nota;
    return '<div class="sess"><div class="st"><span class="sd">'+fmtData(s.data)+'</span>'+pill.apply(null,ESTADO_SESSAO[s.estado])+'</div>'+
      '<div style="margin-top:10px;display:grid;gap:9px">'+
      linhaNota("Queixa principal",n.queixa)+linhaNota("Temas abordados",n.temas)+
      linhaNota("Intervenções (TCC)",n.intervencoes)+linhaNota("Evolução",n.evolucao)+
      linhaNota("Tarefas de casa",n.homework)+linhaNota("Plano p/ próxima",n.plano)+
      '</div><div class="actions"><button class="btn sm" onclick="APP.editNota(\''+p.id+'\',\''+s.id+'\')">✎ Editar nota</button></div></div>';
  }
  function linhaNota(l,v){ if(!v) return ''; return '<div><span style="font-size:.76rem;color:var(--ink-soft);font-weight:600">'+l+':</span> <span style="font-size:.9rem">'+esc(v)+'</span></div>'}

  function tabSessoes(p){
    var rows=p.sessoes.sort(function(a,b){return b.data-a.data}).map(function(s){return sessCard(p,s)}).join("");
    return panel("Sessões & Pagamentos",
      (rows||emptyBox("Sem sessões. Marque a primeira consulta.")),
      '<button class="btn gold sm" onclick="APP.novaSessao(\''+p.id+'\')">＋ Nova consulta</button>');
  }
  function fmtKB(b){ return b<1024*1024 ? Math.round(b/1024)+" KB" : (b/1024/1024).toFixed(1)+" MB"; }
  function anexoRow(pid,sid,tipo,label,anexo){
    var inputId="an_"+tipo+"_"+sid;
    var input='<input id="'+inputId+'" type="file" accept="application/pdf,image/*" style="display:none" '+
      'onchange="APP.anexarComprovativo(\''+pid+'\',\''+sid+'\',\''+tipo+'\',this)">';
    if(anexo){
      var isImg=/^image\//.test(anexo.tipoFich||"");
      var thumb=isImg ? '<img src="'+anexo.dados+'" alt="">' : '<span class="pdf">PDF</span>';
      return '<div class="att">'+
        '<div class="thumb">'+thumb+'</div>'+
        '<div class="ai"><div class="an">'+esc(anexo.nome)+'</div>'+
          '<div class="am"><span class="ok">✓ Anexado</span><span class="sep">·</span>'+label+'<span class="sep">·</span>'+fmtKB(anexo.tamanho)+'</div></div>'+
        '<div class="aa">'+
          '<button class="btn sm" onclick="APP.verComprovativo(\''+pid+'\',\''+sid+'\',\''+tipo+'\')">👁 Ver</button>'+
          '<label class="btn sm" for="'+inputId+'" style="margin:0;cursor:pointer">↻ Substituir</label>'+
          '<button class="btn ghost sm" title="Remover" onclick="APP.removerComprovativo(\''+pid+'\',\''+sid+'\',\''+tipo+'\')">🗑</button>'+
        '</div>'+input+'</div>';
    }
    return '<label class="dz" for="'+inputId+'" '+
        'ondragover="APP.dz(event,1)" ondragenter="APP.dz(event,1)" ondragleave="APP.dz(event,0)" '+
        'ondrop="APP.dropComprovativo(event,\''+pid+'\',\''+sid+'\',\''+tipo+'\')">'+
        '<span class="dzic">↥</span>'+
        '<span class="dzt"><b>'+label+'</b><span>Arraste o PDF/imagem para aqui, ou clique · até 8 MB</span></span>'+
        '<span class="dzcta">Anexar</span>'+input+'</label>';
  }
  function sessCard(p,s){
    var pg=s.pagamento, act="";
    if(pg.estado==="pendente") act+='<button class="btn gold sm" onclick="APP.reserva(\''+p.id+'\',\''+s.id+'\')">Registar reserva (50%)</button>';
    if(pg.estado==="reserva_paga") act+='<button class="btn gold sm" onclick="APP.saldo(\''+p.id+'\',\''+s.id+'\')">Registar saldo</button>';
    if(s.estado==="confirmada"||s.estado==="agendada") act+='<button class="btn primary sm" onclick="APP.realizada(\''+p.id+'\',\''+s.id+'\')">Marcar realizada</button>';
    if(s.nota!==null) act+='<button class="btn sm" onclick="APP.editNota(\''+p.id+'\',\''+s.id+'\')">✎ Nota clínica</button>';
    if(s.estado==="agendada"||s.estado==="confirmada") act+='<button class="btn ghost sm" onclick="APP.cancelar(\''+p.id+'\',\''+s.id+'\')">Cancelar</button>';
    return '<div class="sess">'+
      '<div class="st"><span class="sd">'+fmtData(s.data)+'</span>'+pill.apply(null,ESTADO_SESSAO[s.estado])+'</div>'+
      '<div style="font-size:.85rem;color:var(--ink-soft);margin-top:3px">'+PLANOS[s.plano].nome+' · '+(s.modalidade==="online"?"Online":"Presencial")+'</div>'+
      '<div class="pay">'+pill.apply(null,ESTADO_PAG[pg.estado])+
        '<span>Total <b class="money">'+kz(pg.total)+'</b></span>'+
        '<span style="color:var(--ink-soft)">Reserva <b class="money">'+kz(pg.reserva)+'</b></span>'+
        (pg.estado!=="liquidado"?'<span style="color:var(--ink-soft)">Saldo <b class="money">'+kz(pg.saldo)+'</b></span>':'')+
        (pg.metodo?'<span class="pill p-info" style="margin-left:auto">'+(pg.metodo==="bai"?"BAI":pg.metodo==="express"?"Express":pg.metodo)+'</span>':'')+
      '</div>'+
      anexoRow(p.id,s.id,"reserva","Comprovativo da reserva",pg.anexos&&pg.anexos.reserva)+
      (pg.estado!=="pendente"?anexoRow(p.id,s.id,"saldo","Comprovativo do saldo",pg.anexos&&pg.anexos.saldo):"")+
      (act?'<div class="actions">'+act+'</div>':'')+
    '</div>';
  }

  // ============ AÇÕES ============
  APP.reserva=function(pid,sid){ var r=find(pid,sid); registarReserva(r.p,r.s); };
  APP.saldo=function(pid,sid){ var r=find(pid,sid); registarSaldo(r.p,r.s); };
  APP.realizada=function(pid,sid){ var r=find(pid,sid); marcarRealizada(r.p,r.s); if(state.currentPatient)renderDetalhe(); };
  // ---- comprovativo de pagamento (PDF ou imagem) ----
  var ANEXO_MAX=8*1024*1024; // 8 MB
  function processarComprovativo(pid,sid,tipo,f){
    if(!f) return;
    if(!/^application\/pdf$|^image\//.test(f.type)){ toast("Anexe um ficheiro PDF ou imagem"); return; }
    if(f.size>ANEXO_MAX){ toast("Ficheiro grande demais (máximo 8 MB)"); return; }
    var reader=new FileReader();
    reader.onload=function(){
      var r=find(pid,sid); if(!r.s) return;
      r.s.pagamento.anexos[tipo]={nome:f.name, tipoFich:f.type, dados:reader.result, tamanho:f.size};
      if(tipo==="reserva" && r.s.pagamento.estado==="pendente"){ registarReserva(r.p,r.s); }
      else if(tipo==="saldo" && r.s.pagamento.estado==="reserva_paga"){ registarSaldo(r.p,r.s); }
      else { persist(); toast("Comprovativo anexado ✓"); if(state.currentPatient) renderDetalhe(); }
    };
    reader.onerror=function(){ toast("Não foi possível ler o ficheiro"); };
    reader.readAsDataURL(f);
  }
  APP.anexarComprovativo=function(pid,sid,tipo,inputEl){ var f=inputEl.files&&inputEl.files[0]; processarComprovativo(pid,sid,tipo,f); inputEl.value=""; };
  APP.dropComprovativo=function(e,pid,sid,tipo){ e.preventDefault(); if(e.currentTarget) e.currentTarget.classList.remove("drag");
    var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; processarComprovativo(pid,sid,tipo,f); };
  APP.dz=function(e,on){ e.preventDefault(); if(e.currentTarget) e.currentTarget.classList.toggle("drag",!!on); };
  APP.verComprovativo=function(pid,sid,tipo){
    var r=find(pid,sid); var a=r.s.pagamento.anexos&&r.s.pagamento.anexos[tipo]; if(!a) return;
    try{ var w=window.open(a.dados,"_blank"); if(!w) throw new Error("bloqueado"); }
    catch(e){ var l=document.createElement("a"); l.href=a.dados; l.download=a.nome||"comprovativo";
      document.body.appendChild(l); l.click(); l.remove(); }
  };
  APP.removerComprovativo=function(pid,sid,tipo){
    var r=find(pid,sid); if(r.s.pagamento.anexos) r.s.pagamento.anexos[tipo]=null;
    persist(); toast("Comprovativo removido"); if(state.currentPatient) renderDetalhe();
  };

  APP.cancelar=function(pid,sid){ var r=find(pid,sid), s=r.s;
    var horas=(s.data - Date.now()/864e5)*24;
    var perde = horas<24 && s.pagamento.estado!=="pendente";
    APP.confirmar("Cancelar consulta",
      perde
        ? "Faltam <b>menos de 24 horas</b> para esta consulta. Conforme os Termos, o cancelamento implica a <b>perda da reserva ("+kz(s.pagamento.reserva)+")</b>. Continuar?"
        : "Cancelar a consulta de <b>"+fmtData(s.data)+"</b>?",
      perde ? "Cancelar (perde a reserva)" : "Cancelar consulta",
      function(){
        if(perde){ s.estado="perda_reserva"; toast("Cancelada — perda da reserva, conforme os Termos"); }
        else { s.estado="cancelada"; toast("Consulta cancelada"); }
        refresh(); if(state.currentPatient) renderDetalhe();
      });
  };
  function find(pid,sid){ var p=state.patients.filter(function(x){return x.id===pid})[0];
    var s=p.sessoes.filter(function(x){return x.id===sid})[0]; return {p:p,s:s}; }

  // ---- envio de mensagens (WhatsApp) ----
  APP.waTermos=function(pid,marcar){ var p=byId(pid); if(!p)return; sendWa(p.telefone,msgTermos(p));
    if(marcar&&!p.termos){ p.termos=true; p.termosData=hoje(); if(state.currentPatient) renderDetalhe(); updateBadges(); } };
  APP.copiarTermos=function(pid){ var p=byId(pid); if(p) copiar(msgTermos(p)); };
  APP.waLembrete=function(pid,sid){ var r=find(pid,sid); sendWa(r.p.telefone,msgLembrete(r.p,r.s)); };
  APP.waReserva=function(pid,sid){ var r=find(pid,sid); sendWa(r.p.telefone,msgReserva(r.p,r.s)); };
  APP.waRenov=function(pid){ var p=byId(pid); if(p) sendWa(p.telefone,msgRenov(p)); };

  // ---- cópia de segurança (dentro da app) ----
  APP.exportar=function(){
    try{
      var blob=new Blob([JSON.stringify(snapshot(),null,2)],{type:"application/json"});
      var url=URL.createObjectURL(blob), a=document.createElement("a");
      a.href=url; a.download="crm-ivana-backup-"+hoje()+".json"; document.body.appendChild(a); a.click();
      setTimeout(function(){URL.revokeObjectURL(url);a.remove();},120); toast("Cópia de segurança descarregada");
    }catch(e){ toast("Não foi possível exportar aqui"); }
  };
  APP.importar=function(inp){ var f=inp.files&&inp.files[0]; if(!f)return;
    var r=new FileReader(); r.onload=function(){ try{ var d=JSON.parse(r.result);
      if(!d||!d.patients){ toast("Ficheiro inválido"); return; }
      APP.confirmar("Importar cópia de segurança",
        "A cópia contém <b>"+d.patients.length+" paciente(s)</b>. Ao importar, <b>substitui os dados atuais</b> por estes. Continuar?",
        "Importar e substituir",
        function(){
          loading=true; aplicar(d); loading=false; persist();
          toast("Dados importados"); state.currentPatient=null; setView("inicio");
        });
    }catch(e){ toast("Ficheiro inválido"); } }; r.readAsText(f); inp.value=""; };
  APP.salvarPrecos=function(){ var a=parseInt(val("cfg_av"),10), b=parseInt(val("cfg_ac"),10);
    if(a>0)PLANOS.avulsa.preco=a; if(b>0)PLANOS.acompanhamento.preco=b; persist(); toast("Valores atualizados"); renderDefinicoes(); };
  APP.salvarTermos=function(){ var t=(document.getElementById("cfg_terms").value||"").split("\n")
      .map(function(s){return s.trim()}).filter(Boolean); state.config.terms=t.length?t:TERMOS_DEFAULT.slice();
    persist(); toast("Termos atualizados"); };
  APP.verTermos=function(){
    openModal(modal("Termos e Condições de Atendimento",
      '<ol style="margin:0;padding-left:20px;display:grid;gap:11px;font-size:.92rem">'+
      (state.config.terms||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ol>',
      '<button class="btn gold" onclick="APP.close()">Fechar</button>'));
  };

  // ============ MODAIS ============
  var overlay=document.getElementById("overlay"), host=document.getElementById("modalHost");
  function openModal(html){ host.innerHTML=html; overlay.classList.add("open"); }
  APP.close=function(){ overlay.classList.remove("open"); host.innerHTML=""; };
  overlay.addEventListener("click",function(e){ if(e.target===overlay) APP.close(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&overlay.classList.contains("open")) APP.close(); });

  // confirmação da própria app (substitui o confirm() nativo do navegador)
  var confirmCb=null;
  APP.confirmar=function(titulo,corpo,txtBtn,cb){
    confirmCb=cb;
    openModal(modal(titulo,
      '<p style="margin:0;font-size:.93rem;line-height:1.6">'+corpo+'</p>',
      '<button class="btn ghost" onclick="APP.close()">Voltar</button>'+
      '<button class="btn dgr" onclick="APP.confirmarOk()">'+txtBtn+'</button>'));
  };
  APP.confirmarOk=function(){ var f=confirmCb; confirmCb=null; APP.close(); if(f) f(); };

  APP.novoPaciente=function(){
    openModal(modal("Novo paciente",
      '<div class="field"><label>Nome completo *</label><input id="f_nome" placeholder="Ex.: Ana Sofia Mendes"></div>'+
      '<div class="frow"><div class="field"><label>Data de nascimento</label><input id="f_nasc" type="date"></div>'+
      '<div class="field"><label>Contacto telefónico *</label><input id="f_tel" placeholder="+244 9xx xxx xxx"></div></div>'+
      '<div class="check"><input type="checkbox" id="f_termos"><label for="f_termos" style="font-weight:500">Enviar <b>boas-vindas + Termos e Condições</b> e registar o aceite formal do paciente.</label></div>',
      '<button class="btn ghost" onclick="APP.close()">Cancelar</button><button class="btn gold" onclick="APP.salvarPaciente()">Guardar paciente</button>'));
    setTimeout(function(){var e=document.getElementById("f_nome"); if(e) e.focus();},50);
  };
  APP.salvarPaciente=function(){
    var nome=val("f_nome"), tel=val("f_tel"), nasc=val("f_nasc"), termos=document.getElementById("f_termos").checked;
    if(!nome||!tel){ toast("Preencha nome e contacto"); return; }
    var p=novoPaciente(nome,nasc,tel,termos);
    APP.close(); toast("Paciente adicionado"+(termos?" · Termos enviados":"")); state.nextView="pacientes"; setView("pacientes");
    setTimeout(function(){APP.abrir(p.id)},250);
  };

  APP.novaSessao=function(pid){
    openModal(modal("Nova consulta",
      '<div class="field"><label>Plano</label><select id="s_plano" onchange="APP.previewPreco()">'+
        '<option value="avulsa">Consulta avulsa — 15.000 Kz</option>'+
        '<option value="acompanhamento">Plano de acompanhamento — 35.000 Kz</option></select></div>'+
      '<div class="frow"><div class="field"><label>Modalidade</label><select id="s_mod"><option value="presencial">Presencial</option><option value="online">Online</option></select></div>'+
      '<div class="field"><label>Data e hora</label><input id="s_data" type="datetime-local"></div></div>'+
      '<div class="hint"><span>₭</span><div>Reserva a pagar (50%): <b id="s_reserva">7.500 Kz</b>. A consulta fica confirmada assim que registar o comprovativo.</div></div>',
      '<button class="btn ghost" onclick="APP.close()">Cancelar</button><button class="btn gold" onclick="APP.salvarSessao(\''+pid+'\')">Marcar consulta</button>'));
    var dt=new Date(); dt.setDate(dt.getDate()+1); dt.setHours(9,0,0,0);
    document.getElementById("s_data").value=dt.toISOString().slice(0,16);
  };
  APP.previewPreco=function(){ var pl=PLANOS[val("s_plano")]; document.getElementById("s_reserva").textContent=kz(Math.round(pl.preco*0.5)); };
  APP.salvarSessao=function(pid){
    var p=state.patients.filter(function(x){return x.id===pid})[0];
    var plano=val("s_plano"), mod=val("s_mod"), dv=val("s_data");
    if(!dv){toast("Escolha data e hora");return;}
    var frac=new Date(dv).getTime()/864e5;
    var s=novaSessao(p,plano,mod,frac);
    APP.close(); toast("Consulta marcada · reserva "+kz(s.pagamento.reserva)); state.patientTab="sessoes"; renderDetalhe(); updateBadges();
  };

  APP.editNota=function(pid,sid){
    var r=find(pid,sid), n=r.s.nota||{queixa:"",temas:"",intervencoes:"",evolucao:"",homework:"",plano:""};
    openModal(modal("Nota clínica — "+fmtData(r.s.data).split(" · ")[0],
      ta("n_q","Queixa principal",n.queixa)+ta("n_t","Temas abordados",n.temas)+
      ta("n_i","Intervenções baseadas em TCC",n.intervencoes)+ta("n_e","Evolução do paciente",n.evolucao)+
      ta("n_h","Tarefas de casa (homework)",n.homework)+ta("n_p","Plano para a próxima sessão",n.plano),
      '<button class="btn ghost" onclick="APP.close()">Cancelar</button><button class="btn gold" onclick="APP.salvarNota(\''+pid+'\',\''+sid+'\')">Guardar nota</button>'));
  };
  APP.salvarNota=function(pid,sid){
    var r=find(pid,sid);
    r.s.nota={queixa:val("n_q"),temas:val("n_t"),intervencoes:val("n_i"),evolucao:val("n_e"),homework:val("n_h"),plano:val("n_p")};
    if(r.s.estado==="confirmada"||r.s.estado==="agendada") r.s.estado="realizada";
    APP.close(); toast("Nota clínica guardada"); renderDetalhe();
  };

  APP.editEnquadramento=function(pid){
    var p=state.patients.filter(function(x){return x.id===pid})[0];
    openModal(modal("Enquadramento inicial",
      ta("e_m","Motivo da consulta",p.motivo)+ta("e_d","Diagnóstico",p.diagnostico)+ta("e_o","Objetivos terapêuticos",p.objetivos),
      '<button class="btn ghost" onclick="APP.close()">Cancelar</button><button class="btn gold" onclick="APP.salvarEnq(\''+pid+'\')">Guardar</button>'));
  };
  APP.salvarEnq=function(pid){ var p=state.patients.filter(function(x){return x.id===pid})[0];
    p.motivo=val("e_m"); p.diagnostico=val("e_d"); p.objetivos=val("e_o"); APP.close(); toast("Enquadramento guardado"); renderDetalhe(); };

  function modal(title,body,footer){
    return '<div class="modal"><div class="mh"><h3>'+title+'</h3><button class="x" onclick="APP.close()">×</button></div>'+
      '<div class="mb">'+body+'</div><div class="mf">'+footer+'</div></div>';
  }
  function ta(id,l,v){return '<div class="field"><label>'+l+'</label><textarea id="'+id+'">'+esc(v)+'</textarea></div>'}
  function val(id){var e=document.getElementById(id);return e?e.value.trim():""}

  // ============ TOAST ============
  var toastEl=document.getElementById("toast"),toastMsg=document.getElementById("toastMsg"),toastT;
  function toast(m){toastMsg.textContent=m;toastEl.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove("show")},2600);}

  // ============ NAV ============
  document.getElementById("nav").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b)return; state.currentPatient=null; setView(b.dataset.view);
  });

  // ============ REPOR DEMONSTRAÇÃO ============
  document.getElementById("resetBtn").addEventListener("click",function(){ APP.reporDemo(); });

  // Aviso se houver trabalho por sincronizar
  window.addEventListener("beforeunload",function(e){
    if(pendenteSync){ e.preventDefault(); e.returnValue=""; }
  });
  // Sair de um campo de notas grava ja, sem esperar os 800 ms ("blur" nao borbulha -> captura)
  document.addEventListener("blur",function(e){
    if(e.target && e.target.tagName==="TEXTAREA" && pendenteSync) cloudSaveNow();
  },true);

  // ============ ARRANQUE ============
  if(window.CRM_CONFIG && !window.supabase){
    // A23: configurado para a nuvem mas a biblioteca nao carregou.
    // Falhar FECHADO: nunca abrir sem autenticacao nem escrever dados no disco.
    document.getElementById("login").classList.add("open");
    loginErr("Falha ao carregar um componente da aplica\u00e7\u00e3o. Recarregue a p\u00e1gina. Se persistir, contacte o suporte.");
    document.getElementById("loginBtn").disabled=true;
  } else if(cloudInit()){
    cloudBoot();                      // online: login primeiro, depois dados da nuvem
  } else {
    if(!load()){ loading=true; seed(); loading=false; persist(); }
    updateBadges(); render("inicio"); // local: como sempre
  }
})();
</script>

</body>
</html>
